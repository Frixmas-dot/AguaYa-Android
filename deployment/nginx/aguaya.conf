# ============================================================
#  AguaYa — Configuración Nginx para AWS EC2
#  Ruta en el servidor: /etc/nginx/sites-available/aguaya
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _; # Acepta la IP pública de AWS EC2 o cualquier dominio

    # Tamaño máximo de subida para fotos en reportes ciudadanos
    client_max_body_size 25M;

    # ------------------------------------------------------------
    # 1. FRONTEND: Aplicación Web Vue 3 (Single Page Application)
    # ------------------------------------------------------------
    root /var/www/aguaya/frontend/dist;
    index index.html;

    location / {
        # Si la ruta no es un archivo o carpeta real, redirige a index.html (Vue Router)
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------
    # 2. BACKEND API: Proxy Reverso hacia Node.js Express (:3001)
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;

        # Headers HTTP para preservar la IP y datos del cliente
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para subida de fotos y consultas pesadas
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------------------------
    # 3. Optimización y compresión Gzip
    # ------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ------------------------------------------------------------
    # 4. Caché de archivos estáticos (imágenes, fuentes, css, js)
    # ------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
